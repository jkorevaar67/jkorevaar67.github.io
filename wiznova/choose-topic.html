<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wiznova · Materiaal kiezen</title><style>body{margin:0;background:#f3f5fc;color:#303c61;font:17px/1.6 system-ui}header{background:#e8eafa;padding:30px}main{max-width:900px;margin:30px auto;padding:20px}.card{padding:24px;background:white;border:1px solid #dcdff2;border-radius:20px;margin:18px 0}a,button{color:#35487c}a.button,button{display:inline-block;background:#b1bbed;border:0;border-radius:12px;padding:14px 20px;text-decoration:none;margin:8px;font:inherit;font-weight:700}label{display:block;margin-top:16px}select{padding:12px;font:inherit;max-width:100%;width:100%;border:1px solid #c5cbed;border-radius:10px}button:disabled{opacity:.45}</style><header><a href="index.html">← Kies je klas</a><h1 id="heading">Wiznova</h1><a href="/bijles.html">Vraag bijles aan</a></header><main><section class="card"><label>Wat wil je doen?<select id="activity"><option value="learn">Leren</option><option value="exercise">Oefenen</option><option value="test">Test maken</option></select></label><label>Hoofdstuk<select id="chapter"></select></label><label>Paragraaf<select id="section"></select></label><p id="empty"></p><button id="start" disabled>Start</button></section></main><script src="../en/chapter-catalog.js"></script><script>
const group=new URLSearchParams(location.search).get('klas'),labels={mavo2:'MAVO 2',havo3:'HAVO 3',vwo3:'VWO 3'},$=id=>document.getElementById(id);const items=(window.WIZNOVA_CATALOG||[]).filter(x=>x.group===group);$('heading').textContent=labels[group]||'Kies eerst je klas';
function chapters(){const seen=new Set();$('chapter').replaceChildren();for(const x of items)if(!seen.has(x.chapter)){seen.add(x.chapter);$('chapter').add(new Option(x.chapter+' · '+x.chapterTitle,String(x.chapter)))}sections()}
function sections(){$('section').replaceChildren();for(const x of items.filter(x=>String(x.chapter)===$('chapter').value))$('section').add(new Option(x.chapter+'.'+x.section+' · '+x.title,String(x.section)));update()}
function update(){const item=items.find(x=>String(x.chapter)===$('chapter').value&&String(x.section)===$('section').value);$('start').disabled=!item;$('empty').textContent=items.length?'':'Voor deze klas staat nog geen lesmateriaal klaar.';$('start').onclick=()=>{if(item)location.href=item.pages[$('activity').value]}}
$('chapter').onchange=sections;$('section').onchange=update;$('activity').onchange=update;chapters();
</script></html>
