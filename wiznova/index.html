<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiznova | Binnenkort beschikbaar</title>
  <style>
    :root{color-scheme:light;--ink:#161d3c;--mint:#e9ebf6;--coral:#ef947f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#e5e8f4,#f8f9fb 65%,#fceee8);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
    main{width:min(100%,610px);background:white;border:1px solid #d9dce9;border-radius:28px;padding:clamp(30px,7vw,66px);box-shadow:0 20px 55px #242b4c20;text-align:center}
    .symbol{display:inline-grid;place-items:center;width:76px;height:76px;background:var(--mint);border-radius:24px;font-size:38px;margin-bottom:16px}
    h1{font-size:clamp(38px,7vw,56px);margin:0 0 6px;letter-spacing:-1.5px}
    h2{font-size:clamp(21px,4vw,28px);margin:0 0 22px;color:#bf6656}
    p{font-size:18px;line-height:1.65;margin:0 auto 30px;max-width:440px}
    a{display:inline-block;background:var(--ink);color:white;padding:15px 24px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none;transition:background .2s,transform .2s}
    a:hover,a:focus-visible{background:#27336b;transform:translateY(-2px)}
    footer{font-size:13px;color:#707484;margin-top:30px}
  </style>
<link rel="icon" href="/favicon.ico">
<style id="bijles-link-style">a.bijles-link{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;padding:9px 14px;border:1px solid #a6adce;border-radius:9px;background:#e9ebf5;color:#17214e!important;font:700 14px/1.4 system-ui,Arial,sans-serif;text-decoration:none;margin:5px}a.bijles-link:hover{background:#d4d8eb}a.bijles-link:focus-visible{outline:3px solid #6955c7;outline-offset:3px}.bijles-access{padding:8px 16px;text-align:right;background:#f5f6fa;border-bottom:1px solid #d4d8e9}.bijles-home{margin:28px 0;text-align:center}.bijles-home p{margin:0 0 10px;font-size:17px}</style><style id="wiznova-blue-standard">
body{background-color:#f3f5fc;color:#303c61}
body>header{background:#e8eafa;color:#303c61;border-bottom:1px solid #dcdff2}
body>header p,body>header h1,body>header strong{color:#303c61}
body>header a{color:#465781!important}
body>nav,.mathfinity-global-nav,.global-nav,.bijles-access{background:#fbfbff;border-color:#dcdff2}
nav a{color:#465781}h2,h3{color:#586ca1}
a.bijles-link{background:#e9eafa;color:#303d6b!important;border-color:#c5cbed}
a.bijles-link:hover{background:#dce0f8}
.bijles-access{background:#f3f5fc}
.bijles-home{background:#e8eafa;border:1px solid #dcdff2;border-radius:20px;padding:25px}
</style></head>
<body><div class="bijles-access"><a class="bijles-link" href="/bijles.html">Vraag bijles aan</a></div>
  <main>
    <img src="/wiznova-logo.jpg" alt="Wiznova-logo" style="display:block;width:240px;max-width:100%;height:auto;margin:0 auto 22px;border-radius:16px">
    <h1>Wiznova</h1>
    <h2>Binnenkort beschikbaar!</h2>
    <p>We werken hard aan deze leeromgeving. Binnenkort kun je hier aan de slag met nieuwe oefeningen.</p>
    <a href="/">← Terug naar het welkomscherm</a>
    <footer>Bedankt voor je geduld!</footer>
  </main>
</body>
</html>
