<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiznova | Binnenkort beschikbaar</title>
  <style>
    :root{color-scheme:light;--ink:#163c35;--mint:#e9f6ee;--coral:#ef947f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#e5f4eb,#f9fbf8 65%,#fceee8);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
    main{width:min(100%,610px);background:white;border:1px solid #d9e9df;border-radius:28px;padding:clamp(30px,7vw,66px);box-shadow:0 20px 55px #244c3520;text-align:center}
    .symbol{display:inline-grid;place-items:center;width:76px;height:76px;background:var(--mint);border-radius:24px;font-size:38px;margin-bottom:16px}
    h1{font-size:clamp(38px,7vw,56px);margin:0 0 6px;letter-spacing:-1.5px}
    h2{font-size:clamp(21px,4vw,28px);margin:0 0 22px;color:#bf6656}
    p{font-size:18px;line-height:1.65;margin:0 auto 30px;max-width:440px}
    a{display:inline-block;background:var(--ink);color:white;padding:15px 24px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none;transition:background .2s,transform .2s}
    a:hover,a:focus-visible{background:#276b59;transform:translateY(-2px)}
    footer{font-size:13px;color:#70847a;margin-top:30px}
  </style>
<link rel="icon" href="/favicon.ico">
</head>
<body>
  <main>
    <img src="/wiznova-logo.jpg" alt="Wiznova-logo" style="display:block;width:240px;max-width:100%;height:auto;margin:0 auto 22px;border-radius:16px">
    <h1>Wiznova</h1>
    <h2>Binnenkort beschikbaar!</h2>
    <p>We werken hard aan deze leeromgeving. Binnenkort kun je hier aan de slag met nieuwe oefeningen.</p>
    <a href="/">← Terug naar het welkomscherm</a>
    <footer>Bedankt voor je geduld!</footer>
  </main>
</body>
</html>
