 ['START · 2 MIN','De toren zonder meetlint','<p>P en Q liggen <strong>24 m uit elkaar</strong>, aan dezelfde kant van de toren, op een horizontale lijn door de torenvoet. Vanuit P kijk je onder 30° naar de top, vanuit Q onder 60°.</p><p><strong>Voorspel.</strong> Is de toren lager dan, even hoog als of hoger dan 24 m? Leg uit wat je al kunt afleiden uit de tekening.</p><p>Vandaag rekenen we <strong>exact</strong>. De schets is niet op schaal.</p>',()=>tower(false)],
 ['ANTWOORD OP DE VOORSPELLING','De toren is lager dan 24 m.',''],
 ['SAMEN · STAP 1','Maak de driehoek van 30° en 60°','<ol><li>Begin met een gelijkzijdige driehoek met zijde 2.</li><li>Teken de hoogtelijn. Waarom verdeelt die de basis én de tophoek in twee gelijke delen?</li><li>Bereken de hoogte met Pythagoras.</li></ol><p><strong>Denkvraag.</strong> Welke zijde ligt tegenover 30°?</p>',()=>triangle60(false)],
 ['SAMEN · STAP 2','Welke zijde ligt tegenover 30°?','<p>De hoogtelijn is ook de symmetrieas. Ze halveert de basis van 2 en de tophoek van 60°.</p><p><strong>Antwoord.</strong> De hoek van 30° zit bovenaan. Recht daartegenover ligt de gemarkeerde halve basis met lengte <strong>1</strong>.</p><p>Met Pythagoras vinden we de andere rechthoekszijde. h = √(2² − 1²) = √3.</p><p><strong>Volgende vraag.</strong> Kijk nu vanuit 60°. Welke zijden wisselen van rol? Wat gebeurt er daardoor met de tangens?</p>',()=>triangle60(true)],
 ['SAMEN · ANTWOORD','Waarom draait de breuk om?','<p>Tangens is <strong>overstaande zijde gedeeld door aanliggende zijde</strong>.</p><p>Bij 30° is die verhouding 1/√3. Bij 60° wisselen dezelfde twee zijden van rol. Dan wordt de verhouding √3/1.</p><p>Dus <strong>tan 30° · tan 60° = 1</strong>.</p><p><strong>Op naar 45°.</strong> Wat gebeurt er met de verhouding als de twee rechthoekszijden even lang zijn?</p>',()=>triangle60(true)],
 ['SAMEN · STAP 3','Maak de driehoek van 45°','<p>Een vierkant heeft zijde 1. Teken de diagonaal.</p><ol><li>Verklaar beide hoeken van 45°.</li><li>Bereken de diagonaal met Pythagoras.</li><li>Voorspel welke goniometrische verhoudingen gelijk zijn.</li></ol>',()=>triangle45(false)],
 ['SAMEN · STAP 4','Van driehoek naar verhouding','<p>De diagonaal is <strong>√2</strong>. De twee rechthoekszijden zijn even lang.</p><p>sin 45° = cos 45° = 1/√2 = <strong>√2/2</strong><br>tan 45° = <strong>1</strong></p><p>Voor elke opgave gebruik je dezelfde volgorde.</p><ol><li>Schets en markeer de hoek.</li><li>Label de zijden vanuit die hoek.</li><li>Kies sin, cos of tan en vul exact in.</li><li>Controleer of je antwoord past bij je schets.</li></ol>',()=>triangle45(true)],
 ['ZELF AAN DE SLAG · 5 MIN','Bouw je eigen tabel','<ol><li>Teken beide driehoeken uit je hoofd. Noteer de hoeken en exacte zijden.</li><li>Maak een tabel met 30°, 45° en 60°. Vul voor elke hoek <strong>sin, cos en tan</strong> in. Schrijf bij twee waarden op welke zijden je deelt.</li><li>Controleer de bewering <strong>sin 60° = 2 · sin 30°</strong>. Verbeter haar door de juiste vermenigvuldigingsfactor te vinden.</li></ol><p>Werk eerst zelfstandig. Vergelijk daarna je tabel met die van je buur.</p>'],
 ['ZELF AAN DE SLAG · 8–10 MIN','Los het torenprobleem op','<ol><li>Neem <strong>QV = x</strong> en <strong>TV = h</strong>. Noteer PV in x.</li><li>Schrijf h op twee manieren met <strong>tan 30°</strong> en <strong>tan 60°</strong>.</li><li>Bereken x en h exact. Controleer je voorspelling.</li><li><strong>Extra.</strong> Waar ligt R op de lijn door P en Q als je aan dezelfde kant van de toren onder 45° naar de top kijkt? Geef QR exact en bewijs dat R tussen P en Q ligt.</li></ol>',()=>tower(true)],
 ['NABESPREKING','Tabel en denkfout','<table aria-label="Exacte goniometrische waarden"><tr><th>Hoek</th><th>sin</th><th>cos</th><th>tan</th></tr><tr><th>30°</th><td>1/2</td><td>√3/2</td><td>√3/3</td></tr><tr><th>45°</th><td>√2/2</td><td>√2/2</td><td>1</td></tr><tr><th>60°</th><td>√3/2</td><td>1/2</td><td>√3</td></tr></table><p>sin 60° = <strong>√3 · sin 30°</strong>. De schuine zijde is in beide verhoudingen 2. De overstaande zijde verandert van 1 in √3.</p>',()=>triangle60(true)],
 ['NABESPREKING','De toren is 12√3 m hoog','<p>Vanuit Q volgt <strong>h = x · √3</strong>.<br>Vanuit P volgt <strong>h = (x + 24)/√3</strong>.</p><p>Stel gelijk en vermenigvuldig beide kanten met √3.</p><p>3 · x = x + 24, dus x = 12.<br>Dan is h = <strong>12√3 m</strong>. Omdat √3 &lt; 2 is de toren lager dan 24 m.</p><p><strong>Extra.</strong> tan 45° = 1, dus RV = h. Uit 12 &lt; 12√3 &lt; 36 volgt dat R tussen Q en P ligt. <strong>QR = 12(√3 − 1) m.</strong></p>',()=>tower(true)]
];
let index=0;const $=s=>document.querySelector(s);
function show(){
 const [phase,title,copy,figure]=slides[index];
 $('#phase').textContent=phase;$('h1').textContent=title;$('#copy').innerHTML=copy;
 $('aside').innerHTML=figure?figure():'';
 $('main').classList.toggle('wide',!figure);
 $('main').classList.toggle('opening',index===0);
 $('output').textContent=(index+1)+' / '+slides.length;
 $('#back').disabled=index===0;$('#next').disabled=index===slides.length-1;
}
function move(step){index=Math.max(0,Math.min(slides.length-1,index+step));show();}
$('#back').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
document.addEventListener('keydown',event=>{
 if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();move(event.key==='ArrowRight'?1:-1);}
});
show();
</script>
</html>
