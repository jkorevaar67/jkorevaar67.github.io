<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VWO 4 Wiskunde B · §3.3 · Het driehoekige spant</title>
<style>
:root{--paper:#fdfdf8;--grid:#d3e4f4;--ink:#1d2b64;--c:#3b6fe0;--hl:#bcd4ff;--soft:#eaf1ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--ink);
 background:var(--paper) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/34px 34px;
 font:clamp(17px,2vw,29px)/1.4 ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 auto 0 4.2vw;width:3px;background:#f29a9a;opacity:.7;pointer-events:none}
body.think{--c:#7a4fe0;--hl:#ddd0ff;--soft:#f1ecff}
body.answer{--c:#14997c;--hl:#b4f0dc;--soft:#e4f8f1}
body.together{--c:#e8741c;--hl:#ffd9b3;--soft:#fff0e0}
body.work{--c:#3b6fe0;--hl:#bcd4ff;--soft:#eaf1ff}
body.extra{--c:#d6336c;--hl:#ffc9de;--soft:#ffeaf2}
main{flex:1;display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:4vw;padding:4vh 5vw 2vh 9vw}
main.wide{grid-template-columns:minmax(0,1000px)}
main.statement{grid-template-columns:minmax(0,1100px)}
main.statement h1{font-size:3.2em}
.badge{display:inline-flex;align-items:center;gap:.5em;background:var(--c);color:#fff;font-weight:800;font-size:.62em;padding:.4em 1em .4em .7em;border-radius:999px;transform:rotate(-1.5deg);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.badge i{font-style:normal;font-size:1.25em}
h1{font-size:2.2em;line-height:1.18;letter-spacing:-.03em;font-weight:850;margin:.5em 0 .5em}
h1 span{background:linear-gradient(transparent 60%,var(--hl) 60%) no-repeat 0 0/100% 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em;margin:0 -.12em}
h1.sweep span{animation:sweep .7s ease-out}
@keyframes sweep{from{background-size:0 100%}to{background-size:100% 100%}}
p{margin:.6em 0}
strong{background:linear-gradient(transparent 55%,var(--hl) 55%);font-weight:800;padding:0 .1em}
ol{list-style:none;counter-reset:s;padding:0;margin:.8em 0}
ol li{counter-increment:s;display:flex;align-items:center;gap:.7em;margin:.5em 0;padding:.5em .9em;background:#fff;border:2px solid var(--c);border-radius:14px;box-shadow:4px 4px 0 var(--hl)}
ol li::before{content:counter(s);flex:none;display:grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:.85em}
aside{position:relative;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:14px;box-shadow:8px 8px 0 var(--hl);transform:rotate(.8deg)}
aside::before{content:"";position:absolute;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:var(--hl);opacity:.9;transform:rotate(-3deg);border:1px dashed rgba(0,0,0,.15)}
aside:empty{display:none}
svg{display:block;width:100%;max-height:68vh}
svg text{font:800 22px ui-rounded,system-ui,sans-serif;fill:#1d2b64;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
#help:not([hidden]){margin-top:1em;padding:.7em 1em;background:#fff3a8;color:#4a3b00;font-size:.8em;font-weight:600;border-radius:4px 4px 14px 4px;box-shadow:4px 5px 0 rgba(0,0,0,.14);transform:rotate(-1deg)}
footer{display:flex;align-items:center;gap:.6em;padding:1.2vh 5vw 2vh 9vw;flex-wrap:wrap}
#dots{display:flex;gap:.5em;margin-right:auto;align-items:center}
#dots button{all:unset;cursor:pointer;width:.7em;height:.7em;border-radius:50%;background:#b8c4dc;transition:transform .15s}
#dots button.on{transform:scale(1.7);background:var(--c)}
#dots button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
output{color:var(--c);font-size:.6em;font-weight:800;min-width:3.5em}
.nav{font:800 .58em ui-rounded,system-ui,sans-serif;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:.6em 1.1em;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.nav:hover:not(:disabled){background:var(--soft)}
.nav:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.nav:disabled{opacity:.35;cursor:default}
.nav:focus-visible{outline:3px solid var(--c);outline-offset:2px}
#next{background:var(--c);color:#fff;border-color:var(--ink)}
#next:hover:not(:disabled){background:var(--c);filter:brightness(1.1)}
#hint{background:#fff3a8}
@media(max-width:750px){main{grid-template-columns:1fr;gap:1.2em;padding-left:9vw}svg{max-height:50vh}body::before{left:5vw}}
@media(prefers-reduced-motion:reduce){h1.sweep span{animation:none}.nav{transition:none}}
</style>
</head>
<body>
<main><section><div class="badge"><i></i><span></span></div><h1><span></span></h1><div id="copy"></div><div id="help" aria-live="polite" hidden></div></section><aside></aside></main>
<footer><div id="dots" role="tablist" aria-label="Dia’s"></div><output></output><button class="nav" id="hint" aria-controls="help" hidden>💡 Toon hint</button><button class="nav" id="full">Volledig scherm</button><button class="nav" id="prev">← Vorige</button><button class="nav" id="next">Volgende →</button></footer>
<script>
const label=(x,y,value)=>'<text text-anchor="middle" x="'+x+'" y="'+y+'">'+value+'</text>';
function figure(mode){
 const intro=mode==='intro', revealed=mode==='solution';
 const a=intro?47:117,b=intro?479:413,d=intro?205:a+(b-a)/(1+Math.sqrt(3)),c=220-(intro?158:b-d);
 const left=intro?'45°':'60°',right=intro?'30°':'45°';
 const points=a+' 220L'+d+' '+c+'L'+b+' 220';
 return '<svg viewBox="0 0 530 290" role="img" aria-label="'+(intro?'Driehoek met basishoeken 45 en 30 graden en hoogtelijn CD.':'Opgave C9: AB is 10, hoek A is 60 graden en hoek B is 45 graden.')+'">'+
 (!intro&&!revealed?'<path d="M'+points+'Z" fill="#ffe0b8"/>':'<path d="M'+a+' 220L'+d+' '+c+'V220Z" fill="#ffe0b8"/>'+
 '<path d="M'+d+' 220V'+c+'L'+b+' 220Z" fill="#cde8df"/>')+
 '<path d="M'+points+'Z" fill="none" stroke="#233753" stroke-width="4" stroke-linejoin="round"/>'+
 ((intro||revealed)?'<path d="M'+d+' '+c+'V220" stroke="#145e57" stroke-width="3" stroke-dasharray="7 5"/><path d="M'+d+' 206H'+(d+14)+'V220" fill="none" stroke="#145e57" stroke-width="2"/>'+label(d,253,'D')+label(d-22,145,'h'):'')+
 label(a,249,'A')+label(b,249,'B')+label(d,c-18,'C')+
 label(a+47,207,left)+label(b-52,207,right)+
 (intro?'':label(265,281,'AB = 10'))+
 (revealed?label((a+d)/2,249,'h/√3')+label((d+b)/2,249,'h'):'')+
 '</svg>';
}
// [soort, icoon, label, titel, tekst, figuur]
const slides=[
 ['think','🤔','Denktijd · 2 min','Eén spant, twee driehoeken','<p>Een driehoekig spant heeft aan de voet hoeken van <strong>45° en 30°</strong>. Wat kun je al zeggen over de afstanden AD en DB, als CD = h?</p><p><strong>Voorspel.</strong> Welke helft heeft de grootste oppervlakte? Kun je al zeggen hoeveel keer zo groot?</p>',()=>figure('intro')],
 ['answer','💡','Antwoord op de voorspelling','De rechterhelft is √3 keer zo groot.',''],
 ['together','🗣️','Samen','Waarom is de rechterhelft groter?','<p>Links zijn de rechthoekszijden even lang, dus <strong>AD = h</strong>.</p><p>Rechts ligt h tegenover 30°. De bijbehorende basis is <strong>DB = h√3</strong>.</p><p>De twee driehoeken hebben dezelfde hoogte. Daarom is hun oppervlakteverhouding ook <strong>√3 : 1</strong> (rechts : links).</p>',()=>figure('intro')],
 ['work','✏️','C8 · zelf aan de slag · 5 min','Los exact op','<ol><li>6 − x√2 = √10</li><li>½ · x√2 = x − 2</li></ol><p>Schrijf je tussenstappen op. Bij welke vergelijking moet je <strong>x buiten haakjes halen</strong>?</p>'],
 ['answer','✅','C8 · nabespreking','Isoleer x','<p><strong>1.</strong> x√2 = 6 − √10, dus x = (6 − √10)/√2 = <strong>3√2 − √5</strong>.</p><p><strong>2.</strong> x − ½ · x√2 = 2, dus x(1 − ½√2) = 2.</p><p>Daaruit volgt x = 4/(2 − √2) = <strong>4 + 2√2</strong>.</p>'],
 ['work','✏️','C9 · zelf aan de slag · 8 min','Bereken de oppervlakte exact','<p>In driehoek ABC geldt <strong>AB = 10</strong>, ∠A = 60° en ∠B = 45°. Bereken de exacte oppervlakte van ABC.</p><p>Teken zelf een hulplijn en geef de hoogte een letter. Stel daarna een vergelijking op waarmee je de hoogte berekent.</p>',()=>figure('c9')],
 ['answer','✅','C9 · nabespreking · stap 1','Druk beide stukken uit in h','<p>Teken de hoogtelijn CD en neem CD = h.</p><p><strong>Links</strong> ligt h tegenover 60°. De basis AD ligt tegenover 30°. Dus AD = h/√3.</p><p><strong>Rechts</strong> ligt de 45°-driehoek. Daarom is DB = h.</p><p>Omdat AD + DB = 10 geldt <strong>h/√3 + h = 10</strong>.</p>',()=>figure('solution')],
 ['answer','✅','C9 · nabespreking · stap 2','Los op en bereken de oppervlakte','<p>Vermenigvuldig de vergelijking met √3 en haal h buiten haakjes.</p><p>h(1 + √3) = 10√3, dus h = 10√3/(1 + √3) = <strong>15 − 5√3</strong>.</p><p>Oppervlakte ABC = ½ · 10 · h = <strong>75 − 25√3</strong>.</p>',()=>figure('solution')],
 ['extra','🚀','Verdieping','Wat als de basis verdubbelt?','<p>De hoeken blijven gelijk, maar AB wordt 20.</p><p>Wat gebeurt er met de hoogte en de oppervlakte? Leg het uit met de vergelijking uit C9.</p>'],
 ['answer','🎯','Verdieping · antwoord','De oppervlakte wordt vier keer zo groot','<p>In h/√3 + h = AB verdubbelt de rechterkant. Daardoor wordt h twee keer zo groot.</p><p>In ½ · AB · h verdubbelen beide factoren. De oppervlakte wordt dus <strong>vier keer zo groot</strong>.</p>']
];
const hints={
 0:['Vergelijk eerst de hoogtes van beide driehoeken.','Bij gelijke hoogte bepaalt de basis de verhouding. Druk AD en DB uit in h.'],
 3:['Isoleer bij de eerste vergelijking eerst de term x√2.','Breng bij de tweede vergelijking alle termen met x naar dezelfde kant. Haal dan x buiten haakjes.'],
 5:['Teken de loodlijn vanuit C op AB. Noem het voetpunt D en de hoogte h.','Druk AD en DB allebei uit in h. Samen zijn ze 10.']
};
let current=0, hintIndex=0;
const $=selector=>document.querySelector(selector);
$('#dots').innerHTML=slides.map((s,i)=>'<button aria-label="Dia '+(i+1)+': '+s[3].replace(/"/g,'')+'" data-i="'+i+'"></button>').join('');
$('#dots').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){current=+i;show()}};
function show(){
 const [kind,icon,phase,title,copy,visual]=slides[current];
 document.body.className=kind;
 $('.badge i').textContent=icon;$('.badge span').textContent=phase;
 const h=$('h1');h.firstElementChild.textContent=title;
 h.classList.remove('sweep');void h.offsetWidth;h.classList.add('sweep');
 $('#copy').innerHTML=copy;
 $('aside').innerHTML=visual?visual():'';
 $('main').classList.toggle('wide',!visual&&!!copy);
 $('main').classList.toggle('statement',!visual&&!copy);
 $('output').textContent=(current+1)+' / '+slides.length;
 document.querySelectorAll('#dots button').forEach((b,i)=>b.classList.toggle('on',i===current));
 hintIndex=0;
 $('#help').textContent='';$('#help').hidden=true;
 $('#hint').hidden=!hints[current];$('#hint').textContent='💡 Toon hint';
 $('#prev').disabled=current===0;$('#next').disabled=current===slides.length-1;
}
function move(step){current=Math.max(0,Math.min(slides.length-1,current+step));show()}
function toggleHint(){
 const entries=hints[current];
 if(!entries)return;
 if(hintIndex===entries.length){
  hintIndex=0;$('#help').hidden=true;$('#hint').textContent='💡 Toon hint';
  return;
 }
 $('#help').textContent='Hint '+(hintIndex+1)+' · '+entries[hintIndex];
 $('#help').hidden=false;
 hintIndex++;
 $('#hint').textContent=hintIndex===entries.length?'Verberg hint':'💡 Volgende hint';
}
function toggleFull(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
$('#hint').onclick=toggleHint;$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#full').onclick=toggleFull;
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(e.key==='ArrowRight'?1:-1)}
 else if(e.key==='h'||e.key==='H')toggleHint();
 else if(e.key==='f'||e.key==='F')toggleFull();
});
show();
</script>
</body>
</html>
