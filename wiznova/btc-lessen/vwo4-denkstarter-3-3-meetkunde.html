<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VWO 4 Wiskunde B · §3.3 · Het driehoekige spant</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:#18243e;font:clamp(17px,2vw,29px)/1.35 system-ui,sans-serif}
main{display:grid;grid-template-columns:1fr 1.04fr;align-items:center;gap:4vw;min-height:88vh;padding:4vh 5vw}
main.wide{grid-template-columns:minmax(0,1000px);justify-content:center}h1{font-size:2.15em;line-height:1.04;letter-spacing:-.05em;margin:.18em 0 .42em}
small{color:#126259;letter-spacing:.12em;font-size:.63em;font-weight:750}p{margin:.55em 0}li{margin:.45em 0}ol{padding-left:1.2em}strong{color:#9e3f14}
aside{background:#fffaf1;border:2px solid #e9d9b8;border-radius:20px;padding:12px}aside:empty{display:none}svg{display:block;width:100%;max-height:72vh}
svg text{font:700 22px system-ui;fill:#18243e;paint-order:stroke;stroke:#fffaf1;stroke-width:5px;stroke-linejoin:round}
footer{display:flex;align-items:center;justify-content:flex-end;gap:.6em;padding:1vh 5vw 2vh}output{margin-right:auto;color:#126259;font-size:.65em}
button{font:700 .58em system-ui;color:#18385b;background:#e0edff;border:1px solid #627e9b;border-radius:8px;padding:.65em 1em;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #a64b1b}
.math{white-space:nowrap}@media(max-width:750px){main{grid-template-columns:1fr;gap:1em;min-height:0}svg{max-height:50vh}}
#help:not([hidden]){margin-top:.8em;padding:.5em .7em;border-left:4px solid #18776b;background:#def5ee;font-size:.83em}
button:not(:disabled):hover{background:#cbdfff}#hint{background:#def5ee;color:#12564f;border-color:#4c827b}#hint:hover{background:#c6eee1}
</style>
<main><section><small></small><h1></h1><div id="copy"></div><div id="help" aria-live="polite" hidden></div></section><aside></aside></main>
<footer><output></output><button id="hint" aria-controls="help" hidden>Toon hint</button><button id="full">Volledig scherm</button><button id="prev">← Vorige</button><button id="next">Volgende →</button></footer>
<script>
const label=(x,y,value)=>'<text text-anchor="middle" x="'+x+'" y="'+y+'">'+value+'</text>';
function figure(mode){
 const intro=mode==='intro', revealed=mode==='solution';
 const a=intro?47:117,b=intro?479:413,d=intro?205:a+(b-a)/(1+Math.sqrt(3)),c=220-(intro?158:b-d);
 const left=intro?'45°':'60°',right=intro?'30°':'45°';
 const points=a+' 220L'+d+' '+c+'L'+b+' 220';
 return '<svg viewBox="0 0 530 290" role="img" aria-label="'+(intro?'Driehoek met basishoeken 45 en 30 graden en hoogtelijn CD.':'Opgave C9: AB is 10, hoek A is 60 graden en hoek B is 45 graden.')+'">'+
 (!intro&&!revealed?'<path d="M'+points+'Z" fill="#ffe0b8"/>':'<path d="M'+a+' 220L'+d+' '+c+'V220Z" fill="#ffe0b8"/>'+
 '<path d="M'+d+' 220V'+c+'L'+b+' 220Z" fill="#cde8df"/>')+
 '<path d="M'+points+'Z" fill="none" stroke="#233753" stroke-width="4" stroke-linejoin="round"/>'+
 ((intro||revealed)?'<path d="M'+d+' '+c+'V220" stroke="#145e57" stroke-width="3" stroke-dasharray="7 5"/><path d="M'+d+' 206H'+(d+14)+'V220" fill="none" stroke="#145e57" stroke-width="2"/>'+label(d,253,'D')+label(d-22,145,'h'):'')+
 label(a,249,'A')+label(b,249,'B')+label(d,c-18,'C')+
 label(a+47,207,left)+label(b-52,207,right)+
 (intro?'':label(265,281,'AB = 10'))+
 (revealed?label((a+d)/2,249,'h/√3')+label((d+b)/2,249,'h'):'')+
 '</svg>';
}
const slides=[
 ['§3.3 · 2 MIN DENKTIJD','Eén spant, twee driehoeken','<p>Een driehoekig spant heeft aan de voet hoeken van <strong>45° en 30°</strong>. Wat kun je al zeggen over de afstanden AD en DB, als CD = h?</p><p><strong>Voorspel.</strong> Welke helft heeft de grootste oppervlakte? Kun je al zeggen hoeveel keer zo groot?</p>',()=>figure('intro')],
 ['ANTWOORD OP DE VOORSPELLING','De rechterhelft is √3 keer zo groot.',''],
 ['SAMEN','Waarom is de rechterhelft groter?','<p>Links zijn de rechthoekszijden even lang, dus <strong>AD = h</strong>.</p><p>Rechts ligt h tegenover 30°. De bijbehorende basis is <strong>DB = h√3</strong>.</p><p>De twee driehoeken hebben dezelfde hoogte. Daarom is hun oppervlakteverhouding ook <strong>√3 : 1</strong> (rechts : links).</p>',()=>figure('intro')],
 ['C8 · ZELF AAN DE SLAG · 5 MIN','Los exact op','<ol><li>6 − x√2 = √10</li><li>½ · x√2 = x − 2</li></ol><p>Schrijf je tussenstappen op. Bij welke vergelijking moet je <strong>x buiten haakjes halen</strong>?</p>'],
 ['C8 · NABESPREKING','Isoleer x','<p><strong>1.</strong> x√2 = 6 − √10, dus x = (6 − √10)/√2 = <strong>3√2 − √5</strong>.</p><p><strong>2.</strong> x − ½ · x√2 = 2, dus x(1 − ½√2) = 2.</p><p>Daaruit volgt x = 4/(2 − √2) = <strong>4 + 2√2</strong>.</p>'],
 ['C9 · ZELF AAN DE SLAG · 8 MIN','Bereken de oppervlakte exact','<p>In driehoek ABC geldt <strong>AB = 10</strong>, ∠A = 60° en ∠B = 45°. Bereken de exacte oppervlakte van ABC.</p><p>Teken zelf een hulplijn en geef de hoogte een letter. Stel daarna een vergelijking op waarmee je de hoogte berekent.</p>',()=>figure('c9')],
 ['C9 · NABESPREKING · STAP 1','Druk beide stukken uit in h','<p>Teken de hoogtelijn CD en neem CD = h.</p><p><strong>Links</strong> ligt h tegenover 60°. De basis AD ligt tegenover 30°. Dus AD = h/√3.</p><p><strong>Rechts</strong> ligt de 45°-driehoek. Daarom is DB = h.</p><p>Omdat AD + DB = 10 geldt <strong>h/√3 + h = 10</strong>.</p>',()=>figure('solution')],
 ['C9 · NABESPREKING · STAP 2','Los op en bereken de oppervlakte','<p>Vermenigvuldig de vergelijking met √3 en haal h buiten haakjes.</p><p>h(1 + √3) = 10√3, dus h = 10√3/(1 + √3) = <strong>15 − 5√3</strong>.</p><p>Oppervlakte ABC = ½ · 10 · h = <strong>75 − 25√3</strong>.</p>',()=>figure('solution')],
 ['VERDIEPING','Wat als de basis verdubbelt?','<p>De hoeken blijven gelijk, maar AB wordt 20.</p><p>Wat gebeurt er met de hoogte en de oppervlakte? Leg het uit met de vergelijking uit C9.</p>'],
 ['VERDIEPING · ANTWOORD','De oppervlakte wordt vier keer zo groot','<p>In h/√3 + h = AB verdubbelt de rechterkant. Daardoor wordt h twee keer zo groot.</p><p>In ½ · AB · h verdubbelen beide factoren. De oppervlakte wordt dus <strong>vier keer zo groot</strong>.</p>']
];
const hints={
 0:['Vergelijk eerst de hoogtes van beide driehoeken.','Bij gelijke hoogte bepaalt de basis de verhouding. Druk AD en DB uit in h.'],
 3:['Isoleer bij de eerste vergelijking eerst de term x√2.','Breng bij de tweede vergelijking alle termen met x naar dezelfde kant. Haal dan x buiten haakjes.'],
 5:['Teken de loodlijn vanuit C op AB. Noem het voetpunt D en de hoogte h.','Druk AD en DB allebei uit in h. Samen zijn ze 10.']
};
let current=0, hintIndex=0;
const $=selector=>document.querySelector(selector);
function show(){
 const [phase,title,copy,visual]=slides[current];
 $('small').textContent=phase;$('h1').textContent=title;$('#copy').innerHTML=copy;
 $('aside').innerHTML=visual?visual():'';
 $('main').classList.toggle('wide',!visual);
 $('output').textContent=(current+1)+' / '+slides.length;
 hintIndex=0;
 $('#help').textContent='';$('#help').hidden=true;
 $('#hint').hidden=!hints[current];$('#hint').textContent='Toon hint';
 $('#prev').disabled=current===0;$('#next').disabled=current===slides.length-1;
}
function move(step){current=Math.max(0,Math.min(slides.length-1,current+step));show()}
$('#hint').onclick=()=>{
 const entries=hints[current];
 if(!entries)return;
 if(hintIndex===entries.length){
  hintIndex=0;$('#help').hidden=true;$('#hint').textContent='Toon hint';
  return;
 }
 $('#help').textContent='Hint '+(hintIndex+1)+' · '+entries[hintIndex];
 $('#help').hidden=false;
 hintIndex++;
 $('#hint').textContent=hintIndex===entries.length?'Verberg hint':'Volgende hint';
};
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(e.key==='ArrowRight'?1:-1)}
});
show();
</script>
</html>
