= 2.50 + 6 · number of rides"]}, {"topic": "Drawing graphs", "prompt": "Plot the point on y = 4 − 2 · x when x = −2.", "fields": ["x", "y"], "expected": ["-2", "8"], "solution": "4 − 2 · (−2) = 8, so plot (−2, 8).", "visual": "plot", "options": null}, {"topic": "Reading graphs", "prompt": "On the distance graph, how much farther did the cyclist travel after the stop than before the stop?", "fields": ["Difference (km)"], "expected": ["6"], "solution": "After the stop the cyclist covered 18 − 6 = 12 km. Before it, 6 km. The difference is 6 km.", "visual": "trip", "options": null}, {"topic": "Formulas with letters", "prompt": "Calculate V = 2 · a · b − c for a = −3, b = 4 and c = −5.", "fields": ["V"], "expected": ["-19"], "solution": "2 · (−3) · 4 − (−5) = −24 + 5 = −19.", "visual": "", "options": null}, {"topic": "Rough graphs", "prompt": "A bottle is filled at a steady rate. It is wide at the bottom and narrow at the top. How does the graph of water height against time change?", "fields": ["Choose a description"], "expected": ["It rises slowly at first, then more steeply."], "solution": "The same volume raises the water level farther in the narrower part.", "visual": "choice:It rises at the same rate throughout.;It rises steeply at first, then more slowly.", "options": ["It rises at the same rate throughout.", "It rises steeply at first, then more slowly.", "It rises slowly at first, then more steeply."]}, {"topic": "Patterns", "prompt": "Point 1 is (−8, 1). The step is (+3, +2). At what point number does x first become positive, and what is y there?", "fields": ["Point number", "y"], "expected": ["4", "7"], "solution": "The x-values are −8, −5, −2, 1. The fourth point has y = 1 + 3 · 2 = 7.", "visual": "", "options": null}, {"topic": "Drawing graphs", "prompt": "Draw the line segment for y = 3 − x from x = −3 to x = 5. Plot both endpoints.", "fields": ["First x", "First y", "Last x", "Last y"], "expected": ["-3", "6", "5", "-2"], "solution": "At x = −3, y = 6. At x = 5, y = −2. Join the two points.", "visual": "line", "options": null}, {"topic": "Tables", "prompt": "A table has x-values −2, 0, 2 and corresponding y-values 1, 5, 9. If the pattern continues in a straight line, find y at x = 5 and x when y = −3.", "fields": ["y at x = 5", "x when y = −3"], "expected": ["15", "-4"], "solution": "y increases by 2 for each increase of 1 in x. Use y = 5 + 2 · x.", "visual": "", "options": null}, {"topic": "Coordinates", "prompt": "A circle has leftmost point (−7, 2) and rightmost point (3, 2). Find the centre and the radius.", "fields": ["Centre x", "Centre y", "Radius"], "expected": ["-2", "2", "5"], "solution": "The centre is the midpoint (−2, 2). Half the diameter of 10 is 5.", "visual": "", "options": null}, {"topic": "Word formulas", "prompt": "Plan A costs €5 plus €4 per game. Plan B costs €17 plus €2 per game. When do they cost the same, and what is the cost?", "fields": ["Games", "Cost (€)"], "expected": ["6", "29"], "solution": "The €12 difference in starting cost closes by €2 each game. After 6 games both cost €29.", "visual": "", "options": null}, {"topic": "Drawing graphs", "prompt": "A temperature is given by T = 9 − 3 · t. Plot the point where the graph meets the horizontal t-axis. Use t as the horizontal coordinate.", "fields": ["t", "T"], "expected": ["3", "0"], "solution": "On the horizontal axis T = 0. Since 9 − 3 · 3 = 0, plot (3, 0).", "visual": "plot", "options": null}, {"topic": "Rough graphs", "prompt": "A student walks away from home, waits, then runs home at a greater speed than the walking speed. Which rough graph describes distance from home against time?", "fields": ["Choose a description"], "expected": ["Up, flat, then down more steeply to zero."], "solution": "Distance from home rises, stays constant, then decreases to zero. Running gives a steeper segment.", "visual": "choice:Up, flat, then up more steeply.;Down, flat, then up to the starting height.", "options": ["Up, flat, then down more steeply to zero.", "Up, flat, then up more steeply.", "Down, flat, then up to the starting height."]}, {"topic": "Formulas with letters", "prompt": "A score is S = 20 + 3 · w − 2 · l. With 6 wins, the score is 30. How many losses are there?", "fields": ["Losses"], "expected": ["4"], "solution": "20 + 3 · 6 = 38. To reach 30, subtract 8. Since each loss subtracts 2, there are 4 losses.", "visual": "", "options": null}, {"topic": "Coordinates", "prompt": "Reflect (−4, 6) in the y-axis, then move the result down 9 units. Plot the final point.", "fields": ["x", "y"], "expected": ["4", "-3"], "solution": "Reflection gives (4, 6). Moving down gives (4, −3).", "visual": "plot", "options": null}, {"topic": "Patterns", "prompt": "Point 2 is (−1, 7) and point 5 is (8, 1). The step is always the same. Find point 1.", "fields": ["x", "y"], "expected": ["-4", "9"], "solution": "Three steps give (+9, −6), so each step gives (+3, −2). Reverse one step from point 2.", "visual": "", "options": null}, {"topic": "Tables", "prompt": "Complete the table for y = 2 · (x + 1) − 3.", "fields": ["y at x = −3", "y at x = −1", "y at x = 4"], "expected": ["-7", "-3", "7"], "solution": "Substitution gives 2 · (−2) − 3 = −7, 2 · 0 − 3 = −3 and 2 · 5 − 3 = 7.", "visual": "table:-3,-1,4", "options": null}, {"topic": "Reading graphs", "prompt": "Use the distance graph. At what time did the cyclist first reach 14 km?", "fields": ["Time (h)"], "expected": ["7"], "solution": "After hour 5 the cyclist covers 4 km each hour. Going from 6 to 14 km takes 2 hours.", "visual": "trip", "options": null}, {"topic": "Word formulas", "prompt": "A club has €46 to spend. Booking costs €10 and tickets cost €7 each. What is the greatest number of tickets it can buy, and how much money is left?", "fields": ["Tickets", "Money left (€)"], "expected": ["5", "1"], "solution": "€36 remains after the booking fee. Five tickets cost €35. Six would cost €42.", "visual": "", "options": null}, {"topic": "Formulas with letters", "prompt": "For P = 25 + 6 · d + 2 · k, set d = 4. Give the fixed part of the resulting formula and find k for P = 73.", "fields": ["Fixed part", "k"], "expected": ["49", "12"], "solution": "25 + 6 · 4 = 49. Then (73 − 49) ÷ 2 = 12.", "visual": "", "options": null}, {"topic": "Drawing graphs", "prompt": "Lines A and B follow y = 2 + x and y = 8 − 2 · x. Plot their meeting point.", "fields": ["x", "y"], "expected": ["2", "4"], "solution": "A starts 6 units below B and closes the gap by 3 units per step. At x = 2, both give y = 4.", "visual": "plot", "options": null}, {"topic": "Rough graphs", "prompt": "Two walkers start at home together. Both walk straight away from home at constant speeds. A’s distance graph is steeper than B’s. Who is farther away after 5 minutes?", "fields": ["Choose a walker"], "expected": ["Walker A"], "solution": "A gains more distance each minute, so A is farther away at the same positive time.", "visual": "choice:Walker B;They are equally far away.", "options": ["Walker A", "Walker B", "They are equally far away."]}, {"topic": "Coordinates", "prompt": "A rectangle has opposite corners (−3, −2) and (5, 4), with sides parallel to the axes. Its diagonals cross at M. Plot M.", "fields": ["x", "y"], "expected": ["1", "1"], "solution": "Average the x-coordinates and the y-coordinates. (−3 + 5) ÷ 2 = 1 and (−2 + 4) ÷ 2 = 1.", "visual": "plot", "options": null}, {"topic": "Patterns", "prompt": "Point 1 is (−7, 12). Each step adds 2 to x and subtracts 3 from y. One point lies on the x-axis. Give its point number and x-coordinate.", "fields": ["Point number", "x"], "expected": ["5", "1"], "solution": "It takes 12 ÷ 3 = 4 steps to reach y = 0. Point 5 has x = −7 + 4 · 2 = 1.", "visual": "", "options": null}];
const $ = id => document.getElementById(id);
const make = (tag, content) => {
  const element = document.createElement(tag);
  if (content !== undefined) element.textContent = content;
  return element;
};
let current = 0;
let answers = questions.map(question => question.fields.map(() => ''));
const number = value => {
  const clean = value.trim().replace(/−/g, '-').replace(',', '.');
  return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(clean) ? Number(clean) : NaN;
};
const complete = entries => entries.every(value => value.trim() !== '');
const buttons = questions.map((_, index) => {
  const button = make('button', index + 1);
  button.setAttribute('aria-label', 'Question ' + (index + 1));
  button.onclick = () => show(index, true);
  $('jump').append(button);
  return button;
});
function progress() {
  $('progress').textContent = answers.filter(complete).length + ' of ' + questions.length + ' answered';
  buttons.forEach((button, index) => {
    button.classList.toggle('saved', complete(answers[index]));
    if (index === current) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
}
function graph(kind, inputs, fields) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 410 340');
  svg.setAttribute('role', 'img');
  const trip = kind === 'trip';
  svg.setAttribute('aria-label', trip ? 'Distance travelled in kilometres against time in hours. Read the line against the scale.' : 'Coordinate grid. Click to plot or use the coordinate fields.');
  const draw = (name, attrs, value) => {
    const part = document.createElementNS(ns, name);
    for (const [key, val] of Object.entries(attrs)) part.setAttribute(key, val);
    if (value !== undefined) part.textContent = value;
    svg.append(part);
    return part;
  };
  const xmin = trip ? 0 : -10, xmax = trip ? 8 : 10;
  const ymin = trip ? 0 : -10, ymax = trip ? 18 : 10;
  const x = value => 48 + (value - xmin) * 320 / (xmax - xmin);
  const y = value => 295 - (value - ymin) * 260 / (ymax - ymin);
  const line = (a,b,c,d,stroke,width=1) => draw('line',{x1:x(a),y1:y(b),x2:x(c),y2:y(d),stroke,'stroke-width':width});
  const label = (a,b,t) => draw('text',{x:a,y:b,fill:'#2c2451','font-size':11,'text-anchor':'middle'},t);
  for (let a = xmin; a <= xmax; a++) {
    line(a,ymin,a,ymax,'#dcd4ea');
    if (trip || a % 2 === 0) label(x(a), y(ymin)+17, a);
  }
  for (let b = ymin; b <= ymax; b += trip ? 2 : 1) {
    line(xmin,b,xmax,b,'#dcd4ea');
    if (b % 2 === 0) label(x(xmin)-16,y(b)+4,b);
  }
  line(xmin,0,xmax,0,'#46356c',1.6);
  line(0,ymin,0,ymax,'#46356c',1.6);
  label(205,329,trip ? 'Time (hours)' : fields[0].endsWith('x') ? 'x' : fields[0]);
  label(65,21,trip ? 'Distance (km)' : fields[1].endsWith('y') ? 'y' : fields[1]);
  if (trip) {
    draw('polyline',{points:[[0,0],[2,6],[5,6],[8,18]].map(([a,b]) => x(a)+','+y(b)).join(' '),fill:'none',stroke:'#513c92','stroke-width':4});
    return {svg};
  }
  svg.classList.add('interactive');
  let point = 0;
  const marks = [];
  function paint() {
    marks.splice(0).forEach(mark => mark.remove());
    const points = [];
    for (let i = 0; i < inputs.length; i += 2) {
      const a = number(inputs[i].value), b = number(inputs[i+1].value);
      if (a >= xmin && a <= xmax && b >= ymin && b <= ymax) points.push([a,b]);
    }
    if (points.length === 2) marks.push(line(...points[0],...points[1],'#513c92',3));
    points.forEach(([a,b]) => marks.push(draw('circle',{cx:x(a),cy:y(b),r:5,fill:'#513c92'})));
  }
  svg.onclick = event => {
    const p = new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse());
    if (p.x < 44 || p.x > 372 || p.y < 31 || p.y > 299) return;
    const a = Math.max(xmin,Math.min(xmax,Math.round(xmin+(p.x-48)*(xmax-xmin)/320)));
    const b = Math.max(ymin,Math.min(ymax,Math.round(ymin+(295-p.y)*(ymax-ymin)/260)));
    inputs[point].value = a;
    inputs[point+1].value = b;
    answers[current] = inputs.map(input => input.value);
    point = (point + 2) % inputs.length;
    paint();
    progress();
  };
  paint();
  return {svg,paint};
}
function show(index, focus = false) {
  current = index;
  const q = questions[index];
  $('topic').textContent = 'Question ' + (index + 1) + ' / ' + questions.length + ' · ' + q.topic;
  $('prompt').textContent = q.prompt;
  $('visual').replaceChildren();
  $('fields').replaceChildren();
  let view;
  const inputs = q.fields.map((field, i) => {
    const label = make('label', field);
    const input = make(q.options ? 'select' : 'input');
    if (q.options) {
      const blank = make('option','Select an answer');
      blank.value = '';
      input.append(blank,...q.options.map(value => make('option',value)));
    } else {
      input.inputMode = 'decimal';
      input.autocomplete = 'off';
    }
    input.value = answers[index][i];
    input.oninput = () => {
      answers[index][i] = input.value;
      view?.paint?.();
      progress();
    };
    label.append(input);
    $('fields').append(label);
    return input;
  });
  if (['plot','line','trip'].includes(q.visual)) {
    view = graph(q.visual, inputs, q.fields);
    $('visual').append(view.svg);
    if (q.visual !== 'trip') $('visual').append(make('small','Click the grid or enter the coordinates below. For a segment, plot the left endpoint first.'));
  }
  if (q.visual.startsWith('table:')) {
    const table = make('table');
    const row = table.insertRow();
    const outputs = table.insertRow();
    row.append(make('th','x'));
    outputs.append(make('th','y'));
    q.visual.slice(6).split(',').forEach(value => {
      row.insertCell().textContent = value.replace('-','−');
      outputs.insertCell().textContent = '?';
    });
    $('visual').append(table);
  }
  $('prev').disabled = index === 0;
  $('next').disabled = index === questions.length - 1;
  progress();
  if (focus) $('prompt').focus();
}
$('prev').onclick = () => show(current - 1, true);
$('next').onclick = () => show(current + 1, true);
$('submit').onclick = () => {
  const missing = answers.filter(entries => !complete(entries)).length;
  if (!confirm(missing ? missing + ' question(s) are incomplete. Submit anyway?' : 'Submit and show the worked solutions?')) return;
  let total = 0;
  const details = questions.map((q, index) => {
    const entries = answers[index];
    const right = q.expected.every((value,i) => q.options ? entries[i] === value : Math.abs(number(entries[i]) - Number(value)) < 1e-9);
    total += Number(right);
    const item = make('details');
    item.append(make('summary',(index + 1) + '. ' + q.topic + ' · ' + (right ? 'Correct' : complete(entries) ? 'Incorrect' : 'Incomplete')));
    item.append(make('p',q.prompt),make('p','Your answer — ' + entries.map((value,i) => q.fields[i] + ': ' + (value.trim() || '—')).join(' · ')),make('p',q.solution));
    return item;
  });
  $('score').textContent = 'Score: ' + total + ' / ' + questions.length;
  $('solutions').replaceChildren(...details);
  $('quiz').hidden = true;
  $('jump').parentElement.hidden = true;
  $('review').hidden = false;
  $('score').focus();
};
$('retry').onclick = () => {
  answers = questions.map(question => question.fields.map(() => ''));
  $('review').hidden = true;
  $('quiz').hidden = false;
  $('jump').parentElement.hidden = false;
  show(0, true);
};
show(0);
</script>
