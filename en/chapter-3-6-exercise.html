"site-links"><a href="/en/" data-mnav="home">Home</a><a href="/en/choose-topic.html" data-mnav="choose" aria-current="page">Choose a Chapter</a><a href="/en/need-help.html" data-mnav="help">Need help?</a><a href="/en/student-of-the-week.html" data-mnav="week">Student of the Week</a><a href="/bijles.html" data-mnav="bijles">Tutoring</a></div></div></nav><main><section class="card"><p>Chapter 3 · Graphs and Formulas</p><h1>3.6 Drawing graphs from a formula</h1><p>Make a table and plot a graph from a formula.</p><div class="lesson-tabs" aria-label="Lesson pages"><a href="chapter-3-6.html">Learn</a><a href="chapter-3-6-exercise.html" aria-current="page">Exercise</a><a href="chapter-3-6-test.html">Test</a></div></section><section class="card" id="setup"><h2>Exercise</h2><p>Ten practice questions with hints and worked answers.</p><label for="level">Level</label> <select id="level"><option value="0">Basic</option><option value="1">Intermediate</option><option value="2">Challenge</option></select> <button id="start" type="button">Start round</button><p id="setupError" role="alert"></p></section>
 <section class="card" id="quiz" hidden><p id="progress"></p><h2 id="question"></h2><form id="form"><div id="plot"></div><div class="word-fields" id="fields"></div><button id="check" type="submit">Check answer</button><button id="hint" type="button">Hint</button><button id="reveal" type="button">Show worked answer</button></form><p id="feedback" aria-live="polite"></p><button id="next" type="button" hidden>Continue</button></section>

 <script>const TEST=false;const SECTION=6;
function make(level,practice=false){
 const shift=practice?1+Math.floor(Math.random()*4):0;
 return Array.from({length:10},(_,i)=>{
  const n=i+2+shift, a=2+level+i%3, b=3+2*level+SECTION%4;
  const type=SECTION===6?i%5:SECTION===11?i%5:(i+(SECTION-7)*2)%10;
  const graph=(prompt,values,hint,solution,plot)=>[prompt,plot?'x-coordinate|y-coordinate':'Answer',values,hint,solution,plot];
  if(SECTION===11){
   const w=a,h=level+1, start=2*w+2*h, added=start+4*(n-1), total=w*h+n*start+2*n*(n-1);
   const rule='Start with a '+w+' by '+h+' rectangle. Each step adds every empty square sharing an edge with the current figure. ';
   if(type===0)return [rule+'How many squares are added at steps 1 and 2?','Step 1|Step 2',[start,start+4],'Count the four outer edges first.','The edges add 2 × '+w+' + 2 × '+h+' = '+start+'. The next layer adds four more.'];
   if(type===1)return [rule+'How many squares are added at step '+n+'?','Squares added',[added],'After step 1 each new layer contains four more squares.',''+start+' + 4 × ('+n+' − 1) = '+added+'.'];
   if(type===2)return [rule+'At which step does the new layer contain '+added+' squares?','Step number',[n],'Subtract the first layer, divide by four and add one.','1 + ('+added+' − '+start+') ÷ 4 = '+n+'.'];
   if(type===3)return [rule+'For the formula L = c + dn, L is the number added at step n. Find c and d.','c|d',[start-4,4],'Step 1 gives c + d.','L = '+(start-4)+' + 4n.'];
   return [rule+'How many squares are in the whole figure after '+n+' steps?','Total',[total],'Include the rectangle and sum all new layers.','The total is '+(w*h)+' + '+n+' × ('+start+' + '+added+') ÷ 2 = '+total+'.'];
  }
  if(SECTION===6){
   const x=level?2:1, down=level>0&&i%2!==0, end=down?b+a*4:b, rate=down?-a:a, y=t=>end+rate*t;
   const formula='y = '+end+(down?' − ':' + ')+a+'x';
   if(type===2)return ['Draw the line for '+formula+' from x = 0 to x = 4. Select both endpoints in order or enter their coordinates.','First x|First y|Last x|Last y',[0,y(0),4,y(4)],'Calculate y at x = 0 and at x = 4.','Join (0, '+y(0)+') to (4, '+y(4)+').',{maxX:4,maxY:Math.max(y(0),y(4)),xLabel:'x',yLabel:'y',line:true}];
   if(type===0)return graph('Plot the point for x = '+x+' on '+formula+'. Select the point on the grid or enter its coordinates.',[x,y(x)],'Substitute x into the formula.','The point is ('+x+', '+y(x)+').',{maxX:4,maxY:Math.max(y(0),y(4)),xLabel:'x',yLabel:'y'});
   if(type===1)return ['Complete the table for '+formula+'.','y at x = 0|y at x = 2|y at x = 4',[y(0),y(2),y(4)],'Use each x-value in the formula.','The three y-values are '+[y(0),y(2),y(4)].join(', ')+'.'];
   if(type===3)return ['For '+formula+', enter the y-intercept and the change in y when x increases by 1.','y-intercept|Change in y',[end,rate],'Look at the value at zero and the coefficient of x.','At x = 0, y = '+end+'. The change is '+rate+'.'];
   if(level===2)return ['Two prices are A = '+b+' + '+(a+2)+'x and B = '+(b+8)+' + '+a+'x. Where do the graphs meet?','x|Price',[4,b+4*(a+2)],'A starts 8 lower and rises 2 faster.','8 ÷ 2 = 4; the common price is '+(b+4*(a+2))+'.'];
   return ['The graph of '+formula+' goes through a point with y = '+y(3)+'. Find its x-coordinate.','x',[3],'Undo the addition or subtraction and divide by the coefficient.','Substituting x = 3 gives '+y(3)+'.'];
  }
  if(type===0)return ['Start at the origin. Move '+n+' units left and '+a+' units up. Give the coordinates.','x|y',[-n,a],'The horizontal coordinate comes first.','The point is (−'+n+', '+a+').'];
  if(type===1)return ['Three vertices of an axis-aligned rectangle are (0, 0), ('+n+', 0) and ('+n+', '+a+'). Find the fourth vertex.','x|y',[0,a],'Match the left x-coordinate and the top y-coordinate.','The fourth vertex is (0, '+a+').'];
  if(type===2)return ['A sequence begins at ('+b+', '+n+'). At each step add '+a+' to x and subtract 2 from y. Find point '+(level+3)+'.','x|y',[b+(level+2)*a,n-2*(level+2)],'Point 1 needs no step.','Take '+(level+2)+' steps from the first point. The result is ('+(b+(level+2)*a)+', '+(n-2*(level+2))+').'];
  if(type===3)return ['A distance graph has points (0, 0), (2, '+a*2+'), (4, '+a*2+') and (6, '+a*6+'). Time is in hours and distance in km. Find the duration of the stop and the speed on the last segment.','Stop (h)|Last speed (km/h)',[2,2*a],'The stop is horizontal. Divide distance gained by elapsed time for speed.','The stop lasts 4 − 2 = 2 hours. Last speed = ('+a*6+' − '+a*2+') ÷ 2 = '+2*a+'.'];
  if(type===4)return ['A rental costs €'+b+' plus €'+a+' per day. Find the cost for '+n+' days.','Cost (€)',[b+a*n],'Multiply before adding the fixed fee.',''+b+' + '+a+' × '+n+' = '+(b+a*n)+'.'];
  if(type===5)return ['Evaluate '+b+' − '+a+'(x − 1) when x = −'+n+'.','Value',[b+a*(n+1)],'Work out the brackets first.','The bracket is '+(-n-1)+' and the result is '+(b+a*(n+1))+'.'];
  if(type===6)return ['Use y = '+b+' + '+a+'x. Plot the point for x = '+(level+1)+'.','x|y',[level+1,b+a*(level+1)],'Calculate y at the given x.','The point is ('+(level+1)+', '+(b+a*(level+1))+').',{maxX:4,maxY:b+4*a,xLabel:'x',yLabel:'y'}];
  if(type===7)return ['A table for y = '+b+' + '+a+'x lists x = 0, '+n+' and '+(n+1)+'. Enter the three outputs.','First y|Second y|Third y',[b,b+a*n,b+a*(n+1)],'Substitute each input.','The values are '+[b,b+a*n,b+a*(n+1)].join(', ')+'.'];
  if(type===8)return ['A circle has centre ('+a+', '+b+') and radius '+n+'. Find the coordinates of its rightmost point.','x|y',[a+n,b],'Move one radius to the right from the centre.','The rightmost point is ('+(a+n)+', '+b+').'];
  return ['A price formula is p = '+b+' + '+a+'d + 2h. Given d = '+n+' and p = '+(b+a*n+8+2*level)+', find h.','h',[4+level],'First calculate the fixed part for the given d.','Subtract '+(b+a*n)+' from p, then divide by 2. The answer is '+(4+level)+'.'];
 });
}
const BANK=[0,1,2].map(level=>make(level));
function practice(level){return make(level,true);}
function parse(raw){
 const value=raw.trim().replace(/−/g,'-').replace(/,/g,'.');
 if(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(value))return Number(value);
 const fraction=value.match(/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/);
 return fraction && Number(fraction[2])!==0?Number(fraction[1])/Number(fraction[2]):NaN;
}
function judge(state,values,answers){
 if(state.locked)return 'locked';
 if(values.length!==answers.length||!values.every(Number.isFinite))return 'invalid';
 if(!answers.every((answer,i)=>Math.abs(answer-values[i])<1e-9)){state.disqualified=true;return 'wrong';}
 state.locked=true;
 return state.disqualified?'correct':'credit';
}
function assist(state,reveal){
 if(state.locked)return;
 state.disqualified=true;
 if(reveal)state.locked=true;
}
const $=id=>document.getElementById(id);
const preview=window.self!==window.top;
let score=0, queued=0, index=0, questions=[], state, round;
function addPlot(plot){
 const box=document.createElement('div'), ns='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(ns,'svg'), W=380,H=340, left=42,top=16, width=306,height=280;
 svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width','380');
 svg.setAttribute('aria-label','Coordinate grid. Use the answer boxes for keyboard entry.');
 svg.style.maxWidth='100%';svg.style.height='auto';svg.style.touchAction='manipulation';
 const x=v=>left+width*v/plot.maxX,y=v=>top+height*(1-v/plot.maxY);
 function draw(tag,attrs,text){
  const el=document.createElementNS(ns,tag);
  for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);
  if(text!==undefined)el.textContent=text;
  svg.append(el);return el;
 }
 draw('rect',{x:left,y:top,width,height,fill:'#f5f7ff'});
 for(let i=0;i<=plot.maxX;i++){
  draw('line',{x1:x(i),y1:top,x2:x(i),y2:y(0),stroke:'#a8b8df'});
  draw('text',{x:x(i),y:y(0)+18,'text-anchor':'middle','font-size':13},i);
 }
 const tick=plot.maxY>16?2:1;
 for(let i=0;i<=plot.maxY;i++){
  draw('line',{x1:left,y1:y(i),x2:x(plot.maxX),y2:y(i),stroke:'#a8b8df'});
  if(i%tick===0)draw('text',{x:left-6,y:y(i)+4,'text-anchor':'end','font-size':12},i);
 }
 draw('text',{x:359,y:y(0)+4},plot.xLabel);
 draw('text',{x:left,y:12},plot.yLabel);
 const line=plot.line?draw('line',{stroke:'#563ca1','stroke-width':3,visibility:'hidden','pointer-events':'none'}):null;
 const dots=Array.from({length:plot.line?2:1},()=>draw('circle',{r:6,fill:'#563ca1',visibility:'hidden','pointer-events':'none'}));
 let nextPoint=0;
 function paint(){
  const inputs=[...$('fields').querySelectorAll('input')];
  const points=dots.map((dot,i)=>{
   const px=parse(inputs[2*i].value),py=parse(inputs[2*i+1].value);
   const valid=px>=0&&px<=plot.maxX&&py>=0&&py<=plot.maxY;
   dot.setAttribute('visibility',valid?'visible':'hidden');
   if(valid){dot.setAttribute('cx',x(px));dot.setAttribute('cy',y(py));return [x(px),y(py)];}
   return null;
  });
  if(!line)return;
  line.setAttribute('visibility',points.every(Boolean)?'visible':'hidden');
  if(points.every(Boolean))for(const [i,[px,py]] of points.entries()){line.setAttribute('x'+(i+1),px);line.setAttribute('y'+(i+1),py);}
 }
 for(const input of $('fields').querySelectorAll('input'))input.addEventListener('input',paint);
 svg.addEventListener('click',event=>{
  if(state.locked)return;
  const pt=svg.createSVGPoint();pt.x=event.clientX;pt.y=event.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  if(p.x<left-7||p.x>x(plot.maxX)+7||p.y<top-7||p.y>y(0)+7)return;
  const px=Math.max(0,Math.min(plot.maxX,Math.round((p.x-left)*plot.maxX/width)));
  const py=Math.max(0,Math.min(plot.maxY,Math.round((y(0)-p.y)*plot.maxY/height)));
  const inputs=$('fields').querySelectorAll('input');inputs[nextPoint*2].value=px;inputs[nextPoint*2+1].value=py;
  nextPoint=(nextPoint+1)%dots.length;paint();
 });
 box.append(svg);$('plot').replaceChildren(box);
}
function show(){
 const [prompt,labels,,,,plot]=questions[index];
 state={locked:false,disqualified:false};
 $('progress').textContent='Question '+(index+1)+' of '+questions.length;
 $('question').textContent=prompt;
 $('feedback').textContent='';
 $('fields').replaceChildren();
 labels.split('|').forEach(label=>{
  const wrap=document.createElement('label'),input=document.createElement('input');
  wrap.textContent=label+' ';input.inputMode='text';input.autocomplete='off';
  wrap.append(input);$('fields').append(wrap);
 });
 $('plot').replaceChildren();
 if(plot)addPlot(plot);
 $('next').hidden=true;
 $('check').disabled=$('hint').disabled=$('reveal').disabled=false;
 $('fields').querySelector('input').focus();
}
function lock(){
 for(const input of $('fields').querySelectorAll('input'))input.disabled=true;
 $('check').disabled=$('hint').disabled=$('reveal').disabled=true;
 $('next').hidden=false;$('next').focus();
}
$('start').onclick=()=>{
 if(TEST&&!preview){
  const name=$('name').value.trim(),className=$('className').value;
  if(!name||!className){$('setupError').textContent='Enter your first and last name and choose your class.';return;}
  try{
   let profile={};try{profile=JSON.parse(localStorage.getItem('jkoMathLabStudentV3')||'{}');}catch{}
   localStorage.setItem('jkoMathLabStudentV3',JSON.stringify({...profile,name,className}));
  }catch{$('setupError').textContent='Browser storage is required for the test.';return;}
 }
 round=globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random();
 const level=Number($('level').value);
 questions=TEST?BANK[level]:practice(level);
 score=queued=index=0;$('setupError').textContent='';$('setup').hidden=true;$('finish').hidden=true;$('quiz').hidden=false;show();
};
$('form').onsubmit=async event=>{
 event.preventDefault();
 const q=questions[index],result=judge(state,Array.from($('fields').querySelectorAll('input'),input=>parse(input.value)),q[2]);
 if(result==='locked')return;
 if(result==='invalid'){$('feedback').textContent='Enter a number in every box. You can use a decimal or a fraction.';return;}
 if(result==='wrong'){$('feedback').textContent='Check your calculation and try again.';return;}
 $('feedback').textContent='Correct. '+q[4];
 if(result==='credit')score++;
 const token=round+'-'+index;
 lock();
 if(result==='credit'&&TEST&&!preview){
  const accepted=await window.MathfinityRewards.award(1,'3.6 Drawing graphs from a formula',token);
  if(accepted&&token.startsWith(round+'-'))queued++;
 }
};
$('hint').onclick=()=>{assist(state,false);$('feedback').textContent=questions[index][3];};
$('reveal').onclick=()=>{assist(state,true);$('feedback').textContent=questions[index][4];lock();};
$('next').onclick=()=>{
 if(!state.locked)return;
 if(++index<questions.length){show();return;}
 $('quiz').hidden=true;$('finish').hidden=false;
 $('summary').textContent=score+' / '+questions.length+' correct on the first valid try without help.'+
 (TEST?(preview?' Preview: points stay here.':' Points queued by this round: '+queued+'. See the storage status below.'):' Exercise scores stay in this round.');
 $('restart').focus();
};
$('restart').onclick=()=>{$('finish').hidden=true;$('setup').hidden=false;$('level').focus();};
if(TEST){
 if(preview){$('profile').hidden=true;$('pointStatus').textContent='Preview mode. Points are disabled.';}
 else{
  try{const p=JSON.parse(localStorage.getItem('jkoMathLabStudentV3')||'{}');$('name').value=p.name||'';$('className').value=p.className||'';}catch{}
 }
}</script></main></body></html>
