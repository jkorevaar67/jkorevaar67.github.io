<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose Avatar · Mathfinity</title><style>
:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#263f3b;background:#edf7f1}*{box-sizing:border-box}body{margin:0;background:#edf7f1;min-height:100vh}header{background:#f7fcf8;padding:24px 20px;text-align:center;border-bottom:1px solid #dbe9df}h1,h2{color:#235f50}main{max-width:850px;margin:30px auto;padding:0 18px}.card{background:white;border-radius:20px;padding:28px;box-shadow:0 6px 24px #24583c12}.avatars{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:22px 0}.avatar{background:#fff4ef;border:2px solid #e7c0b1;border-radius:16px;padding:20px 12px;cursor:pointer;font:inherit;color:#603e35}.avatar .face{display:block;font-size:3.5rem;margin-bottom:10px}.avatar strong{display:block}.avatar small{display:block;margin-top:8px}.avatar:disabled{opacity:.55;cursor:not-allowed}.avatar.selected{background:#e6f5eb;border-color:#257b63}.points{background:#e6f5eb;border-radius:12px;padding:13px 16px;font-weight:750}a{color:#257b63;font-weight:700}.muted{color:#667c72}

/* Stable navigation on every Mathfinity page */
html { scrollbar-gutter: stable; }
body > nav.mathfinity-global-nav { display:block !important; position:sticky !important; top:0 !important; padding:0 16px !important; margin:0 !important; width:100% !important; min-height:62px !important; box-sizing:border-box !important; }
body > nav.mathfinity-global-nav > .nav-inner { display:flex !important; justify-content:flex-start !important; align-items:stretch !important; flex-wrap:nowrap !important; gap:4px !important; max-width:1050px !important; width:100% !important; height:62px !important; margin:0 auto !important; padding:0 !important; overflow-x:auto !important; }
body > nav.mathfinity-global-nav .nav-inner > a { box-sizing:border-box !important; flex:0 0 auto !important; height:62px !important; line-height:1.2 !important; padding:0 14px !important; margin:0 !important; font-size:14px !important; border:0 !important; border-radius:0 !important; white-space:nowrap !important; }
@media(max-width:780px){body > nav.mathfinity-global-nav .nav-inner > a {font-size:13px !important;padding:0 11px !important;}}
</style></head><body><nav class="mathfinity-global-nav" aria-label="Mathfinity main navigation"><div class="nav-inner"><a href="index.html" data-mnav="home">⌂ Home</a><a href="choose-topic.html" data-mnav="choose">📚 Choose a Chapter</a><a href="index.html#help" data-mnav="help">💡 Need help?</a><a href="index.html#results" data-mnav="results">🏆 My results</a><a href="student-of-the-week.html" data-mnav="week">🌟 Student of the Week</a><a href="choose-avatar.html" data-mnav="avatar" aria-current="page">🎭 Choose Avatar</a></div></nav><header><h1>🎭 Choose your avatar</h1><p>Unlock a new character as you earn reward points.</p></header><main><section class="card"><h2 id="greeting">Your avatars</h2><p class="points" id="balance"></p><div class="avatars" id="avatars"></div><p id="status" aria-live="polite"></p><p class="muted">Choosing an avatar does not spend your points. Your selection is saved in this browser.</p><p><a href="choose-topic.html">← Back to Choose a Chapter</a></p></section></main><script>
'use strict';
const PROFILE='jkoMathLabStudentV3';
const choices=[{id:'owl',name:'Wise Owl',icon:'🦉',points:5},{id:'fox',name:'Clever Fox',icon:'🦊',points:15},{id:'rocket',name:'Space Explorer',icon:'👩‍🚀',points:30}];
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}
const p=read(PROFILE,{}),key=p.name&&p.className?'mathfinityRewardsV1:'+p.className+'|'+p.name.trim().toLowerCase():null;
function render(){const area=document.getElementById('avatars');area.replaceChildren();if(!key){document.getElementById('greeting').textContent='Enter your name and class first';document.getElementById('balance').textContent='Open a practice lesson and enter your name and class to collect rewards.';return;}const w=read(key,{points:0,avatar:'star',events:[],credited:[]});document.getElementById('greeting').textContent='Hello, '+p.name+'!';document.getElementById('balance').textContent='🪙 '+(w.points||0)+' reward points';choices.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='avatar'+(w.avatar===a.id?' selected':'');b.disabled=(w.points||0)<a.points;b.innerHTML='<span class="face">'+a.icon+'</span><strong>'+a.name+'</strong><small>'+(w.avatar===a.id?'✓ Selected':b.disabled?'Unlock at '+a.points+' points':'Unlocked · Select avatar')+'</small>';b.onclick=()=>{const latest=read(key,{points:0,avatar:'star',events:[],credited:[]});if(latest.points<a.points)return;latest.avatar=a.id;localStorage.setItem(key,JSON.stringify(latest));document.getElementById('status').textContent=a.name+' selected!';render()};area.append(b)})}render();
</script></body></html>
